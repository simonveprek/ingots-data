name: collect prices

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect.py
      - run: python3 backfill.py
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
      - name: commit
        run: |
          git config user.name "ingots-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
